.nav{display:flex;gap:6px;margin:8px auto 0;max-width:520px;overflow-x:auto;pointer-events:auto;padding-bottom:2px}
.nav button{flex:0 0 auto;font:inherit;font-size:.85rem;color:var(--tx);background:var(--pn);border:2px solid var(--bd);border-radius:20px;padding:7px 12px;cursor:pointer}

if(n===1){th-=(e.clientX-p[0])*.006;ph=Math.max(.35,Math.min(1.5,ph-(e.clientY-p[1])*.005));p[0]=e.clientX;p[1]=e.clientY}
else if(n===2){var d0=dist();p[0]=e.clientX;p[1]=e.clientY;var d1=dist();if(d1>0)gr2=Math.max(15,Math.min(320,gr2*d0/d1))}});
el.addEventListener('wheel',function(e){e.preventDefault();gr2=Math.max(15,Math.min(320,gr2*(1+e.deltaY*.001)))},{passive:false});
function size(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
// animasi
var clock=new T.Clock(),t=0;
function loop(){requestAnimationFrame(loop);var dt=Math.min(clock.getDelta(),.05);t+=dt;
people.forEach(function(q){var o=q.o,s;
if(q.a){var sp=o.sp||1.2;q.u+=q.d*sp*dt/q.len;if(q.u>1){q.u=1;q.d=-1}if(q.u<0){q.u=0;q.d=1}
var a=q.a,b=q.b;q.g.position.x=a[0]+(b[0]-a[0])*q.u;q.g.position.z=a[1]+(b[1]-a[1])*q.u;
q.g.rotation.y=Math.atan2((b[0]-a[0])*q.d,(b[1]-a[1])*q.d);
s=Math.sin(t*sp*5+q.ph);q.LL.rotation.x=s*.6;q.RL.rotation.x=-s*.6;
if(o.ab!=null){q.L.rotation.x=o.ab;q.R.rotation.x=o.ab}else{q.L.rotation.x=-s*.5;q.R.rotation.x=s*.5}}
else{s=Math.sin(t*(o.sp||3)+q.ph)*(o.am||.5);var ab=o.ab||0;q.R.rotation.x=ab+s;q.L.rotation.x=o.both?ab+s:ab*.7-s*.5}});
bars.forEach(function(b){b.position.x+=2.2*dt;if(b.position.x>21+13)b.position.x=5;b.material.color.setHex(b.position.x<22?0x4a2a18:0xd4a017)});
mix.forEach(function(m,i){m.rotation.y+=dt*(2+i)});
smoke.forEach(function(s){s.userData.t=(s.userData.t+dt*.12)%1;var u=s.userData.t;s.position.set(34+u*6,15+u*14,-17);s.scale.setScalar(.6+u*2.2);s.material.opacity=.55*(1-u)});
if(wait>0)wait-=dt;else{tx+=9*dt;wheels.forEach(function(w){w.rotation.y-=dt*9/.6*0});
if(ns<3&&tx>=stops[ns]){tx=stops[ns];wait=5;ns++}if(tx>85){tx=-60;ns=0}}
truck.position.set(tx,0,17.2);
clouds.forEach(function(c){c.position.x+=dt*1.2;if(c.position.x>130)c.position.x=-130});
tg.lerp(gt,.06);rr+=(gr2-rr)*.06;
cam.position.set(tg.x+rr*Math.sin(ph)*Math.sin(th),tg.y+rr*Math.cos(ph),tg.z+rr*Math.sin(ph)*Math.cos(th));cam.lookAt(tg);
ren.render(scene,cam)}
loop();
})();
</script>
